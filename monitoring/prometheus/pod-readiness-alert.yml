apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-readiness-alert
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: pod_readiness
      rules:
        - alert: PodReadinessFailure
          expr: |
            min_over_time(kube_pod_status_ready{condition="true"}[5m]) == 0
            and on(pod, namespace) kube_pod_status_phase{phase="Running"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready > 5 min"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been running but not ready for more than 5 minutes."
