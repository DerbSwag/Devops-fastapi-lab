name: Docker CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: derbswag/devops-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: DerbSwag/company-lab-infra
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          sed -i "s/tag: .*/tag: $SHORT_SHA/" helm/fastapi/values.yaml
          cat helm/fastapi/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/fastapi/values.yaml
          git commit -m "ci: update fastapi image to ${GITHUB_SHA::7}"
          git push

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Deploy
        run: |
          cd ~/Devops-fastapi-lab
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/derbswag/devops-api:latest
          docker stop compose_api_1 2>/dev/null || true
          docker rm compose_api_1 2>/dev/null || true
          docker compose -f compose/app.yml up -d
          docker image prune -f
