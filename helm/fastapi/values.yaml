replicaCount: 1

image:
  repository: ghcr.io/derbswag/devops-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "fastapi"

serviceAccount:
  create: false

podAnnotations:
  linkerd.io/inject: enabled
  config.linkerd.io/skip-outbound-ports: "5432"
podLabels: {}
podSecurityContext: {}
securityContext: {}

config:
  APP_ENV: home-lab
  APP_VERSION: "3.0"
  DB_HOST: postgres-0.postgres-service.level5.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: appdb
  DB_SSLMODE: disable
  LOG_LEVEL: info

secret:
  # Home lab placeholders only. Override with a private values file,
  # --set, ExternalSecret, SealedSecret, or CI/CD secret injection.
  DB_PASSWORD: CHANGE_ME
  API_KEY: CHANGE_ME

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: fastapi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
